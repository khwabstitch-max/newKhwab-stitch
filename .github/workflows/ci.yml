name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm run setup
      # Separate steps keep the failing check visible in GitHub job metadata.
      # Continue independent checks after a failure; the job still fails overall.
      - name: Server lint
        run: node scripts/isolated.mjs server-lint --report artifacts/verify-server-lint.txt
      - name: Client lint
        if: ${{ !cancelled() }}
        run: node scripts/isolated.mjs client-lint --report artifacts/verify-client-lint.txt
      - name: Server tests
        if: ${{ !cancelled() }}
        run: node scripts/isolated.mjs server-test --report artifacts/verify-server-test.txt
      - name: Client tests
        if: ${{ !cancelled() }}
        run: node scripts/isolated.mjs client-test --report artifacts/verify-client-test.txt
      - name: Server build
        if: ${{ !cancelled() }}
        run: node scripts/isolated.mjs server-build --report artifacts/verify-server-build.txt
      - name: Client build
        if: ${{ !cancelled() }}
        run: node scripts/isolated.mjs client-build --report artifacts/verify-client-build.txt
      - run: npm run source:check
      - run: npm --prefix server audit --omit=dev
      - run: npm --prefix client audit --omit=dev
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: isolated-check-reports
          path: artifacts/verify-*.txt
          if-no-files-found: ignore
          retention-days: 7
